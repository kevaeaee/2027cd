<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 Countdown | Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050505;
            --bg-gradient: radial-gradient(circle at 50% -20%, #1a103c, #050505 80%);
            --glass-bg: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #8892b0;
            --accent-primary: #00f0ff;
            --accent-secondary: #7000ff;
            --box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            --glow-intensity: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-base: #f0f2f5;
            --bg-gradient: radial-gradient(circle at 50% -20%, #e0e7ff, #f0f2f5 80%);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-dim: #64748b;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            --glow-intensity: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Canvas Layers */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #ambient-canvas { z-index: 1; opacity: 0.6; }
        #fireworks-canvas { z-index: 999; display: none; background: rgba(0,0,0,0.4); }

        /* UI Wrapper */
        #app-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 2rem;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeDown 1s ease-out;
        }

        .timezone-pill {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1.8rem;
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: var(--box-shadow);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .timezone-pill:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-intensity);
        }

        .timezone-pill .indicator {
            width: 8px; height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 2s infinite;
        }

        .timezone-pill span.highlight {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button.theme-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: grid; place-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--box-shadow);
        }

        button.theme-toggle:hover {
            background: var(--text-main);
            color: var(--bg-base);
            transform: rotate(180deg) scale(1.1);
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 5rem;
            box-shadow: var(--box-shadow), inset 0 0 0 1px rgba(255,255,255,0.05);
            text-align: center;
            animation: float 8s ease-in-out infinite, fadeUp 1.2s ease-out;
            position: relative;
            overflow: hidden;
        }

        /* Subtle Inner Glow */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        h1.title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
            position: relative;
        }

        .countdown-grid {
            display: flex;
            gap: 2.5rem;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .time-value {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.1));
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 2px 2px 10px rgba(255,255,255,0.05),
                inset -2px -2px 10px rgba(0,0,0,0.2),
                var(--box-shadow);
            position: relative;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        [data-theme="light"] .time-value {
            background: linear-gradient(145deg, rgba(255,255,255,0.8), rgba(200,200,200,0.2));
            box-shadow: 
                inset 2px 2px 10px rgba(255,255,255,0.8),
                inset -2px -2px 10px rgba(0,0,0,0.05),
                var(--box-shadow);
        }

        .time-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* Footer Signature */
        footer {
            text-align: center;
            padding: 2rem 0 1rem;
            font-size: 0.8rem;
            font-weight: 300;
            color: var(--text-dim);
            letter-spacing: 3px;
            opacity: 0.4;
            transition: opacity 0.4s ease, color 0.4s ease;
            text-transform: uppercase;
        }

        footer:hover {
            opacity: 1;
            color: var(--accent-primary);
        }

        /* Celebration Screen */
        #celebration-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        #celebration-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .celeb-text {
            font-size: 8vw;
            font-weight: 800;
            text-align: center;
            color: #ffffff;
            line-height: 1.1;
            text-transform: uppercase;
            text-shadow: 
                0 0 20px rgba(255,255,255,0.5),
                0 0 60px var(--accent-primary),
                0 0 100px var(--accent-secondary);
            animation: pulse-celeb 2s infinite alternate;
        }

        /* Animations */
        @keyframes float { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-15px); } 
        }
        @keyframes fadeUp { 
            from { opacity: 0; transform: translateY(40px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes fadeDown { 
            from { opacity: 0; transform: translateY(-40px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @keyframes pulse-celeb {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .countdown-grid { flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
            .time-value { width: 100px; height: 100px; font-size: 4rem; border-radius: 20px; }
            .glass-panel { padding: 3rem 2rem; border-radius: 30px; }
            h1.title { font-size: 2.5rem; margin-bottom: 2rem; }
            .timezone-pill { font-size: 0.8rem; padding: 0.6rem 1.2rem; }
        }
        
        @media (max-width: 480px) {
            .countdown-grid { gap: 1rem; }
            .time-value { width: 80px; height: 80px; font-size: 3rem; }
            .time-label { font-size: 0.75rem; letter-spacing: 2px; }
            .celeb-text { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <!-- Ambient Particles Layer -->
    <canvas id="ambient-canvas"></canvas>
    
    <!-- Fireworks Layer (Activated on 2027) -->
    <canvas id="fireworks-canvas"></canvas>
    
    <!-- Celebration TextOverlay -->
    <div id="celebration-screen">
        <div class="celeb-text">Welcome to<br>2027</div>
    </div>

    <div id="app-wrapper">
        <header>
            <div class="timezone-pill">
                <div class="indicator"></div>
                <span id="tz-name" class="highlight">Detecting Location...</span> 
                <span id="tz-time">--:--:--</span>
            </div>
            <button class="theme-toggle" id="theme-btn" title="Toggle Theme">◐</button>
        </header>

        <main>
            <div class="glass-panel" id="main-panel">
                <h1 class="title">Journey to 2027</h1>
                <div class="countdown-grid">
                    <div class="time-block">
                        <div class="time-value" id="days">00</div>
                        <div class="time-label">Days</div>
                    </div>
                    <div class="time-block">
                        <div class="time-value" id="hours">00</div>
                        <div class="time-label">Hours</div>
                    </div>
                    <div class="time-block">
                        <div class="time-value" id="minutes">00</div>
                        <div class="time-label">Minutes</div>
                    </div>
                    <div class="time-block">
                        <div class="time-value" id="seconds">00</div>
                        <div class="time-label">Seconds</div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            Part of Sekawan Pulau Jawa
        </footer>
    </div>

    <script>
        // --- 1. THEME TOGGLE ---
        const themeBtn = document.getElementById('theme-btn');
        const html = document.documentElement;
        themeBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        });

        // --- 2. TIMEZONE & COUNTDOWN LOGIC ---
        const targetDate = new Date('January 1, 2027 00:00:00').getTime();
        let isCelebrating = false;

        const els = {
            tzName: document.getElementById('tz-name'),
            tzTime: document.getElementById('tz-time'),
            d: document.getElementById('days'),
            h: document.getElementById('hours'),
            m: document.getElementById('minutes'),
            s: document.getElementById('seconds'),
            panel: document.getElementById('main-panel'),
            celebScreen: document.getElementById('celebration-screen'),
            fwCanvas: document.getElementById('fireworks-canvas')
        };

        function updateClock() {
            const now = new Date();
            
            // Format Timezone Info
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            els.tzName.innerText = tz.replace('_', ' ');
            els.tzTime.innerText = now.toLocaleTimeString('en-US', { hour12: false });

            // Calculate Distance
            const distance = targetDate - now.getTime();

            if (distance <= 0) {
                if (!isCelebrating) launchCelebration();
                els.d.innerText = "00";
                els.h.innerText = "00";
                els.m.innerText = "00";
                els.s.innerText = "00";
                return;
            }

            // Math
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Render
            els.d.innerText = days.toString().padStart(2, '0');
            els.h.innerText = hours.toString().padStart(2, '0');
            els.m.innerText = minutes.toString().padStart(2, '0');
            els.s.innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. AMBIENT BACKGROUND PARTICLES ---
        const ambCanvas = document.getElementById('ambient-canvas');
        const ambCtx = ambCanvas.getContext('2d');
        let ambW, ambH;
        const ambParticles = [];

        function initAmbient() {
            ambW = ambCanvas.width = window.innerWidth;
            ambH = ambCanvas.height = window.innerHeight;
            ambParticles.length = 0;
            for(let i=0; i<80; i++) {
                ambParticles.push({
                    x: Math.random() * ambW,
                    y: Math.random() * ambH,
                    r: Math.random() * 3 + 1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }
        }
        
        window.addEventListener('resize', initAmbient);
        initAmbient();

        function drawAmbient() {
            ambCtx.clearRect(0, 0, ambW, ambH);
            const isLight = html.getAttribute('data-theme') === 'light';
            
            ambParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > ambW) p.vx *= -1;
                if(p.y < 0 || p.y > ambH) p.vy *= -1;
                
                ambCtx.beginPath();
                ambCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ambCtx.fillStyle = isLight ? `rgba(59, 130, 246, ${p.opacity})` : `rgba(0, 240, 255, ${p.opacity})`;
                ambCtx.fill();
            });
            requestAnimationFrame(drawAmbient);
        }
        drawAmbient();

        // --- 4. MASSIVE FIREWORKS ENGINE ---
        function launchCelebration() {
            isCelebrating = true;
            
            // UI Transition
            els.panel.style.transition = 'all 1s ease';
            els.panel.style.opacity = '0';
            els.panel.style.transform = 'scale(0.8) translateY(100px)';
            
            setTimeout(() => {
                els.panel.style.display = 'none';
                els.fwCanvas.style.display = 'block';
                els.celebScreen.classList.add('active');
                startFireworks();
            }, 1000);
        }

        function startFireworks() {
            const canvas = els.fwCanvas;
            const ctx = canvas.getContext('2d');
            let w, h;
            
            function resizeFW() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeFW);
            resizeFW();

            const fireworks = [];
            const particles = [];
            const colors = ['#00f0ff', '#7000ff', '#ff007f', '#ffea00', '#00ff66'];

            function random(min, max) { return Math.random() * (max - min) + min; }

            class Firework {
                constructor() {
                    this.x = random(w * 0.1, w * 0.9);
                    this.y = h;
                    this.targetY = random(h * 0.1, h * 0.4);
                    this.speed = random(6, 12);
                    this.angle = random(-0.2, 0.2);
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.trail = [];
                }
                update() {
                    this.trail.push({x: this.x, y: this.y});
                    if(this.trail.length > 5) this.trail.shift();
                    
                    this.y -= this.speed;
                    this.x += Math.sin(this.angle) * 3;
                    this.speed *= 0.98; // ease out

                    if (this.speed < 1 || this.y <= this.targetY) {
                        this.explode();
                        return false;
                    }
                    return true;
                }
                draw() {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0]?.x || this.x, this.trail[0]?.y || this.y);
                    ctx.lineTo(this.x, this.y);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                explode() {
                    const particleCount = Math.floor(random(80, 150));
                    for (let i = 0; i < particleCount; i++) {
                        particles.push(new Particle(this.x, this.y, this.color));
                    }
                }
            }

            class Particle {
                constructor(x, y, color) {
                    this.x = x; this.y = y;
                    this.color = color;
                    this.angle = random(0, Math.PI * 2);
                    this.speed = random(2, 15);
                    this.friction = 0.96;
                    this.gravity = 0.25;
                    this.alpha = 1;
                    this.decay = random(0.005, 0.02);
                }
                update() {
                    this.speed *= this.friction;
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed + this.gravity;
                    this.alpha -= this.decay;
                    return this.alpha > 0;
                }
                draw() {
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, random(1, 3), 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            function loop() {
                // Clear with slight opacity for trails
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(0, 0, w, h);
                
                // Launch frequency
                if (Math.random() < 0.08) fireworks.push(new Firework());
                
                for (let i = fireworks.length - 1; i >= 0; i--) {
                    if (!fireworks[i].update()) fireworks.splice(i, 1);
                    else fireworks[i].draw();
                }
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    if (!particles[i].update()) particles.splice(i, 1);
                    else particles[i].draw();
                }
                
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
